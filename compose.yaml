services:
  app:
    image: med-ask-local
    build: .
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8100:8100"
    networks: [backend, homelab-models]
    environment:
      PRIVATE_ROUTES_ENABLED: "true"
      MODEL_BASE_URL: "${MODEL_BASE_URL:-http://litellm:4000/v1}"
      MODEL_API_KEY: "${MODEL_API_KEY:-unused}"
      EMBEDDING_PURPOSE: "${EMBEDDING_PURPOSE:-embed}"
      DATABASE_URL: "postgresql://medask:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/medask"
    volumes:
      - ${SOURCES_PATH:-sources-empty}:/data/sources:ro
      - ${ORIGINALS_PATH:-originals-empty}:/data/originals
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: &app-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/health', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 10s
  public:
    image: med-ask-local
    build: .
    networks: [backend, tunnel, homelab-models]
    environment:
      PRIVATE_ROUTES_ENABLED: "false"
      MODEL_BASE_URL: "${MODEL_BASE_URL:-http://litellm:4000/v1}"
      MODEL_API_KEY: "${MODEL_API_KEY:-unused}"
      EMBEDDING_PURPOSE: "${EMBEDDING_PURPOSE:-embed}"
      DATABASE_URL: "postgresql://medask:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/medask"
    volumes:
      - ${SOURCES_PATH:-sources-empty}:/data/sources:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *app-healthcheck
  ingest:
    image: med-ask-local
    build: .
    profiles: [ingest]
    entrypoint: ["python", "-m", "med_ask.ingest"]
    networks: [backend, homelab-models]
    environment:
      MODEL_BASE_URL: "${MODEL_BASE_URL:-http://litellm:4000/v1}"
      MODEL_API_KEY: "${MODEL_API_KEY:-unused}"
      EMBEDDING_PURPOSE: "${EMBEDDING_PURPOSE:-embed}"
      DATABASE_URL: "postgresql://medask:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/medask"
    volumes:
      - ${SOURCES_PATH:-sources-empty}:/data/sources:ro
      - ${ORIGINALS_PATH:-originals-empty}:/data/originals
    depends_on:
      postgres:
        condition: service_healthy
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    networks: [tunnel]
    depends_on:
      public:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg17
    networks: [backend]
    environment:
      POSTGRES_USER: medask
      POSTGRES_DB: medask
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - ${POSTGRES_DATA_PATH:-postgres-data}:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medask -d medask"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  sources-empty:
  originals-empty:

networks:
  backend:
  tunnel:
  homelab-models:
    external: true
