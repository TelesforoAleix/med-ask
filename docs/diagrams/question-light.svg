<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="q-light-title q-light-desc">
<title id="q-light-title">One question in med-ask</title>
<desc id="q-light-desc">BPMN process with lanes Student, med-ask and Models. The student asks a question; med-ask retrieves candidate passages; a model grades relevance. If no relevant passages are found, med-ask says what is not covered. Otherwise a model writes a short answer labelled as generated, med-ask shows the sources with book and page, and the student opens the page in the viewer.</desc>
<defs>
<marker id="q-light-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D00"/></marker>
<marker id="q-light-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#656560"/></marker>
</defs>
