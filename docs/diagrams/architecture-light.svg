<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">med-ask architecture</title>
        <desc id="architecture-desc">A student uses the built app to find evidence and generated answers through Postgres and HomeLab, with planned page repair, Mac OCR and figure descriptions.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { color: #171717; font-family: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root text { fill: #171717; font-family: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      #architecture-root .heading { font-size: 28px; font-weight: 500; }
      #architecture-root .group { font-size: 14px; font-weight: 600; }
      #architecture-root .name { font-size: 12px; font-weight: 600; }
      #architecture-root .detail { font-size: 9px; font-weight: 400; fill: #656560; }
      #architecture-root .mono { font-size: 9px; font-family: "Geist Mono", "IBM Plex Mono", "SFMono-Regular", Consolas, monospace; fill: #656560; }
      #architecture-root .tag { font-size: 8px; font-weight: 500; letter-spacing: 0.14em; font-family: "Geist Mono", "IBM Plex Mono", "SFMono-Regular", Consolas, monospace; fill: #656560; }
      #architecture-root .diagram-container { overflow-x: visible; }</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#656560"/></marker>
        </defs>
