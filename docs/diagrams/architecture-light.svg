<text x="526" y="313" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#171717" text-anchor="start">Book viewer</text>
<rect x="860" y="96" width="300" height="96" rx="3" fill="#F2F2EF" stroke="#171717" stroke-width="1"/>
<text x="876" y="120" font-family='"SFMono-Regular", Consolas, monospace' font-size="11" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">04 · DATA</text>
<text x="876" y="144" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" font-weight="600" fill="#171717" text-anchor="start">Postgres + pgvector</text>
<text x="876" y="166" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">LlamaIndex index and retrieval</text>
<rect x="860" y="216" width="300" height="132" rx="3" fill="#F2F2EF" stroke="#171717" stroke-width="1"/>
<text x="876" y="240" font-family='"SFMono-Regular", Consolas, monospace' font-size="11" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">05 · MODELS ON HOME LAB</text>
<text x="876" y="264" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" font-weight="600" fill="#171717" text-anchor="start">Model endpoint</text>
<text x="876" y="286" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">chat · embed · grade · vision</text>
<text x="876" y="306" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">Hosted models</text>
<text x="876" y="326" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">Local vision model on a Mac</text>
<text x="40" y="402" font-family='"SFMono-Regular", Consolas, monospace' font-size="11" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">PLANNED</text>
<rect x="510" y="378" width="290" height="60" rx="3" fill="#F2F2EF" stroke="#171717" stroke-width="1" stroke-dasharray="6 4"/>
<text x="526" y="404" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#171717" text-anchor="start">Figure descriptions</text>
<text x="526" y="424" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">Figures are found by caption today</text>
<rect x="860" y="378" width="300" height="60" rx="3" fill="#F2F2EF" stroke="#171717" stroke-width="1" stroke-dasharray="6 4"/>
<text x="876" y="404" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="15" font-weight="600" fill="#171717" text-anchor="start">Nine remaining books</text>
<text x="876" y="424" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">Added to the index in stages</text>
