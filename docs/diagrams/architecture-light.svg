<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="arch-light-title arch-light-desc">
<title id="arch-light-title">med-ask architecture</title>
<desc id="arch-light-desc">The student's browser reaches the public site behind an access gate, which forwards to the Flask app for search, grading, the generated answer and the book viewer. The app uses Postgres with pgvector and the model endpoint on Home Lab, with hosted models and a local vision model on a Mac for scanned pages. Figure descriptions and the nine remaining books are planned.</desc>
<defs>
<marker id="arch-light-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF4D00"/></marker>
<marker id="arch-light-alt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#656560"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="470" fill="#F2F2EF"/>
<text x="40" y="44" font-family='"SFMono-Regular", Consolas, monospace' font-size="12" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">MED-ASK · ARCHITECTURE</text>
<line x1="900" y1="40" x2="930" y2="40" stroke="#171717" stroke-width="1"/>
<text x="938" y="45" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">Built</text>
<line x1="1010" y1="40" x2="1040" y2="40" stroke="#171717" stroke-width="1" stroke-dasharray="6 4"/>
<text x="1048" y="45" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">Planned</text>
<line x1="40" y1="64" x2="1160" y2="64" stroke="#CDCDC7" stroke-width="1"/>
<rect x="40" y="160" width="180" height="100" rx="3" fill="#F2F2EF" stroke="#171717" stroke-width="1"/>
<text x="56" y="184" font-family='"SFMono-Regular", Consolas, monospace' font-size="11" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">01 · CLIENT</text>
<text x="56" y="208" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" font-weight="600" fill="#171717" text-anchor="start">Student's browser</text>
<text x="56" y="230" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">React 19 + Vite</text>
<rect x="270" y="160" width="190" height="100" rx="3" fill="#F2F2EF" stroke="#171717" stroke-width="1"/>
<text x="286" y="184" font-family='"SFMono-Regular", Consolas, monospace' font-size="11" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">02 · EDGE</text>
<text x="286" y="208" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" font-weight="600" fill="#171717" text-anchor="start">Public site</text>
<text x="286" y="230" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">Behind an access gate</text>
<rect x="510" y="96" width="290" height="228" rx="3" fill="#F2F2EF" stroke="#171717" stroke-width="1"/>
<text x="526" y="120" font-family='"SFMono-Regular", Consolas, monospace' font-size="11" font-weight="400" fill="#656560" text-anchor="start" letter-spacing="1.2">03 · APP</text>
<text x="526" y="144" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="17" font-weight="600" fill="#171717" text-anchor="start">Flask app</text>
<text x="526" y="166" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#656560" text-anchor="start">Gunicorn · interface and API</text>
<line x1="526" y1="188" x2="784" y2="188" stroke="#CDCDC7" stroke-width="1"/>
<text x="526" y="211" font-family='"Helvetica Neue", Helvetica, Arial, sans-serif' font-size="14" font-weight="400" fill="#171717" text-anchor="start">Search</text>
