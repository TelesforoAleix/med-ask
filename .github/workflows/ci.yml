name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/check_no_data.py
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      # The action scopes its own scan to the event; scan all history as well.
      - run: gitleaks git --redact --log-opts=--all

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create throwaway database password
        run: |
          umask 077
          python - <<'PY'
          import secrets
          from pathlib import Path
          Path('.env').write_text('POSTGRES_PASSWORD=' + secrets.token_hex(32) + '\n')
          PY
      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Fetch search page and health
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8100/ | tee /tmp/med-ask-page.html
          grep -F '<title>med-ask</title>' /tmp/med-ask-page.html
          curl --fail --silent --show-error http://127.0.0.1:8100/api/health | tee /tmp/med-ask-health.json
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('/tmp/med-ask-health.json').read_text())
          assert health == {'postgres': 'ok', 'vector': 'ok'}, health
          print('\nHealth verified:', health)
          PY
      - name: Prove private and public split without a tunnel token
        run: |
          docker compose exec -T public python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          base = 'http://127.0.0.1:8100'
          with urllib.request.urlopen(base + '/') as response:
              assert response.status == 200
              assert b'<title>med-ask</title>' in response.read()
          with urllib.request.urlopen(base + '/api/health') as response:
              assert json.load(response) == {'postgres': 'ok', 'vector': 'ok'}
          for path in ('/api/private/ping', '/api/private/unknown', '/api/unknown'):
              try:
                  urllib.request.urlopen(base + path)
              except urllib.error.HTTPError as response:
                  assert response.code == 404
                  assert json.load(response) == {'error': 'Unknown API route'}
              else:
                  raise AssertionError(path + ' was reachable')
          PY
          docker compose exec -T app python - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8100/api/private/ping') as response:
              assert response.status == 200
              assert json.load(response) == {'private': 'ok'}
          PY
          test -z "$(docker compose ps --all -q cloudflared)"
      - name: Print app logs on failure
        if: failure()
        run: docker compose logs app public
      - name: Tear down throwaway stack
        if: always()
        run: docker compose down -v
