[project]
name = "med-ask"
version = "0.1.0"
description = "Evidence search across a student's textbooks"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "pymupdf>=1.26,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/med_ask"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
